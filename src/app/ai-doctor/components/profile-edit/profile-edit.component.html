<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4">
  <div class="w-full max-w-sm rounded-2xl bg-white p-6 shadow-xl">
    <!-- header -->
    <div class="flex items-center justify-between">
      <h3 class="font-heading text-lg font-bold text-teal-900">My profile</h3>
      <button (click)="closePanel()" class="material-icons text-teal-900/50">close</button>
    </div>

    <p *ngIf="loading" class="mt-4 text-center text-sm text-teal-900/50">Loading…</p>

    <!-- saved -->
    <div *ngIf="saved" class="py-4 text-center">
      <div class="mx-auto mb-2 flex h-12 w-12 items-center justify-center rounded-full bg-green-50 text-green-600">
        <span class="material-icons" style="font-size:28px">check_circle</span>
      </div>
      <p class="text-sm font-semibold text-teal-900">Details saved!</p>
    </div>

    <!-- form -->
    <div *ngIf="!loading && !saved" class="mt-4 space-y-3">
      <div>
        <label class="text-xs font-medium text-teal-900/60">Name</label>
        <input
          [(ngModel)]="name"
          placeholder="Your name"
          class="mt-1 w-full rounded-lg border border-black/10 px-3 py-2.5 text-sm outline-none focus:border-teal-600"
        />
      </div>

      <div>
        <label class="text-xs font-medium text-teal-900/60">Gender</label>
        <select
          [(ngModel)]="gender"
          class="mt-1 w-full rounded-lg border border-black/10 bg-white px-3 py-2.5 text-sm outline-none focus:border-teal-600"
        >
          <option value="">Prefer not to say</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div>
        <label class="text-xs font-medium text-teal-900/60">Mobile number</label>
        <input
          [value]="mobile"
          readonly
          class="mt-1 w-full cursor-not-allowed rounded-lg border border-black/10 bg-gray-50 px-3 py-2.5 text-sm text-teal-900/60 outline-none"
        />
        <p class="mt-1 text-[10px] text-teal-900/40">Mobile number can't be changed (it's your account ID).</p>
      </div>

      <p *ngIf="error" class="text-center text-xs text-red-600">{{ error }}</p>

      <button
        (click)="save()"
        [disabled]="saving"
        class="mt-1 w-full rounded-xl bg-teal-600 px-4 py-3 text-sm font-semibold text-white hover:bg-teal-700 disabled:opacity-60"
      >
        {{ saving ? 'Saving…' : 'Save changes' }}
      </button>
    </div>
  </div>
</div>
